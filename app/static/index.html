<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星桥 · StarBridge</title>
  <link rel="icon" type="image/png" href="/starbridge.png" />
  <style>
    :root {
      --text: #f8fafc;
      --sec: rgba(241, 245, 249, 0.82);
      --tert: rgba(226, 232, 240, 0.58);
      --glass-grad: linear-gradient(155deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.055) 55%, rgba(255, 255, 255, 0.095) 100%);
      --glass-strong: rgba(255, 255, 255, 0.16);
      --border: rgba(255, 255, 255, 0.24);
      --border-soft: rgba(255, 255, 255, 0.12);
      --sidebar-bg: linear-gradient(165deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.04) 100%);
      --main-bg: rgba(255, 255, 255, 0.015);
      --tabbar-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.03) 100%);
      --seg-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.06) 100%);
      --seg-active-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.16) 100%);
      --seg-active-text: #ffffff;
      --btn-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.08) 100%);
      --btn-hover: linear-gradient(180deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.13) 100%);
      --btn-border: rgba(255, 255, 255, 0.24);
      --btn-text: #ffffff;
      --switch-track: rgba(255, 255, 255, 0.26);
      --input-bg: rgba(9, 13, 24, 0.36);
      --input-border: rgba(255, 255, 255, 0.20);
      --option-bg: #141926;
      --row-hover: rgba(255, 255, 255, 0.08);
      --row-selected: linear-gradient(90deg, rgba(48, 209, 88, 0.22), rgba(48, 209, 88, 0.10));
      --scroll-thumb: rgba(255, 255, 255, 0.24);
      --accent-green: #6ee7b7;
      --accent-blue: #7dd3fc;
      --accent-warn: #fde68a;
      --accent-err: #fecaca;
      --banner-bg: linear-gradient(135deg, rgba(10, 132, 255, 0.24), rgba(56, 189, 248, 0.14));
      --banner-border: rgba(125, 211, 252, 0.42);
      --banner-text: #e0f2fe;
      --banner-ok-bg: linear-gradient(135deg, rgba(48, 209, 88, 0.22), rgba(16, 185, 129, 0.12));
      --banner-ok-border: rgba(110, 231, 183, 0.42);
      --banner-ok-text: #d1fae5;
      --banner-err-bg: linear-gradient(135deg, rgba(255, 69, 58, 0.24), rgba(239, 68, 68, 0.14));
      --banner-err-border: rgba(252, 165, 165, 0.44);
      --banner-err-text: #fee2e2;
      --modal-bg: linear-gradient(160deg, rgba(26, 33, 50, 0.90), rgba(17, 22, 36, 0.92));
      --log-bg: rgba(6, 9, 18, 0.76);
      --toast-bg: linear-gradient(155deg, rgba(30, 38, 56, 0.92), rgba(20, 26, 40, 0.94));
      --toast-text: #ffffff;
      --glass-shadow: 0 10px 28px rgba(0, 0, 0, 0.30), inset 0 1.5px 0 rgba(255, 255, 255, 0.30), inset 1px 0 0 rgba(255, 255, 255, 0.14), inset 0 -1px 0 rgba(0, 0, 0, 0.20);
      --pill-shadow: 0 4px 14px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.34), inset 0 -1px 0 rgba(0, 0, 0, 0.14);
      --ios-blue: #0A84FF;
      --ios-green: #30D158;
      --ios-orange: #FF9F0A;
      --ios-red: #FF453A;
    }

    /* Apple iOS 26 液态玻璃（浅色高对比版：晶莹高光折射 + 深墨黑清晰字体） */
    html.theme-light {
      --text: #0b1220;
      --sec: #334155;
      --tert: #475569;
      --glass-grad: linear-gradient(155deg, rgba(255, 255, 255, 0.86) 0%, rgba(255, 255, 255, 0.64) 55%, rgba(242, 247, 255, 0.76) 100%);
      --glass-strong: rgba(255, 255, 255, 0.90);
      --border: rgba(255, 255, 255, 0.88);
      --border-soft: rgba(15, 23, 42, 0.085);
      --sidebar-bg: linear-gradient(170deg, rgba(255, 255, 255, 0.68) 0%, rgba(246, 249, 255, 0.50) 100%);
      --main-bg: rgba(255, 255, 255, 0.18);
      --tabbar-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.62) 0%, rgba(255, 255, 255, 0.38) 100%);
      --seg-bg: linear-gradient(180deg, rgba(15, 23, 42, 0.075) 0%, rgba(15, 23, 42, 0.045) 100%);
      --seg-active-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(245, 248, 255, 0.88) 100%);
      --seg-active-text: #0b1220;
      --btn-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(244, 247, 252, 0.74) 100%);
      --btn-hover: linear-gradient(180deg, #ffffff 0%, rgba(248, 250, 255, 0.92) 100%);
      --btn-border: rgba(15, 23, 42, 0.11);
      --btn-text: #0b1220;
      --switch-track: rgba(15, 23, 42, 0.24);
      --input-bg: rgba(255, 255, 255, 0.84);
      --input-border: rgba(15, 23, 42, 0.12);
      --option-bg: #ffffff;
      --row-hover: rgba(255, 255, 255, 0.56);
      --row-selected: linear-gradient(90deg, rgba(16, 185, 129, 0.18), rgba(52, 211, 153, 0.08));
      --scroll-thumb: rgba(15, 23, 42, 0.22);
      --accent-green: #047857;
      --accent-blue: #005ec4;
      --accent-warn: #b45309;
      --accent-err: #dc2626;
      --banner-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(219, 234, 254, 0.78));
      --banner-border: rgba(37, 99, 235, 0.28);
      --banner-text: #1e40af;
      --banner-ok-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.84), rgba(209, 250, 229, 0.80));
      --banner-ok-border: rgba(5, 150, 105, 0.30);
      --banner-ok-text: #065f46;
      --banner-err-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.86), rgba(254, 226, 226, 0.82));
      --banner-err-border: rgba(220, 38, 38, 0.30);
      --banner-err-text: #991b1b;
      --modal-bg: linear-gradient(160deg, rgba(255, 255, 255, 0.94), rgba(244, 247, 253, 0.90));
      --log-bg: rgba(241, 245, 249, 0.94);
      --toast-bg: linear-gradient(155deg, rgba(255, 255, 255, 0.96), rgba(244, 247, 253, 0.92));
      --toast-text: #0b1220;
      --glass-shadow: 0 10px 28px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.06), inset 0 1.5px 0 rgba(255, 255, 255, 0.96), inset 1px 0 0 rgba(255, 255, 255, 0.72), inset 0 -1px 0 rgba(15, 23, 42, 0.05);
      --pill-shadow: 0 3px 10px rgba(15, 23, 42, 0.08), inset 0 1.5px 0 rgba(255, 255, 255, 0.98), inset 0 -1px 0 rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      color: var(--text);
      display: flex;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(circle at 14% 18%, rgba(56, 189, 248, 0.34) 0%, transparent 44%),
        radial-gradient(circle at 84% 28%, rgba(52, 211, 153, 0.24) 0%, transparent 42%),
        radial-gradient(circle at 48% 88%, rgba(129, 140, 248, 0.26) 0%, transparent 46%),
        linear-gradient(135deg, #0b1221 0%, #101b32 52%, #0a101d 100%);
    }
    html.theme-light body {
      background:
        radial-gradient(circle at 12% 16%, rgba(96, 165, 250, 0.34) 0%, transparent 42%),
        radial-gradient(circle at 85% 24%, rgba(52, 211, 153, 0.26) 0%, transparent 40%),
        radial-gradient(circle at 52% 90%, rgba(167, 139, 250, 0.20) 0%, transparent 44%),
        linear-gradient(135deg, #e7eef9 0%, #f3f6fc 50%, #e4ecf8 100%);
    }
    html.acrylic body {
      background: linear-gradient(135deg, rgba(16, 22, 36, 0.68), rgba(11, 16, 28, 0.76));
    }
    html.acrylic.theme-light body {
      background:
        radial-gradient(circle at 15% 18%, rgba(147, 197, 253, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(110, 231, 183, 0.16) 0%, transparent 45%),
        linear-gradient(135deg, rgba(245, 248, 253, 0.68), rgba(235, 241, 250, 0.74));
    }

    /* 保留原星桥图标外貌，仅按连接状态变色 */
    .brand-ico-wrap { position: relative; display: inline-flex; width: 26px; height: 26px; flex-shrink: 0; }
    .sb-logo {
      width: 26px; height: 26px; border-radius: 7px; object-fit: cover;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
      transition: filter 0.25s ease, opacity 0.25s ease;
    }
    .sb-logo.idle { filter: grayscale(1) brightness(0.92) contrast(1.06); opacity: 0.88; }
    .sb-logo.busy { filter: hue-rotate(192deg) saturate(1.55) brightness(1.06); opacity: 1; }
    .sb-logo.on   { filter: hue-rotate(-52deg) saturate(1.28) brightness(1.04); opacity: 1; }
    .sb-logo.warn { filter: grayscale(0.65) brightness(0.92); opacity: 0.95; }
    .logo-alert-dot {
      display: none; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px;
      border-radius: 50%; background: var(--ios-red); border: 1.5px solid #141824;
    }
    html.theme-light .logo-alert-dot { border-color: #ffffff; }
    .brand-ico-wrap.is-warn .logo-alert-dot { display: block; }

    /* 左侧液态玻璃控制栏 */
    .sidebar {
      width: 300px; flex-shrink: 0; height: 100vh;
      background: var(--sidebar-bg);
      backdrop-filter: blur(36px) saturate(195%);
      -webkit-backdrop-filter: blur(36px) saturate(195%);
      border-right: 1px solid var(--border);
      box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.25);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 15px; gap: 10px; overflow-y: auto;
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-name { font-size: 15px; font-weight: 700; line-height: 1.1; color: var(--text); letter-spacing: -0.01em; }
    .brand-ver { font-size: 10px; font-weight: 600; color: var(--sec); }

    /* 液态玻璃胶囊按钮 */
    .btn {
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-text);
      padding: 6px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
      backdrop-filter: blur(18px) saturate(180%);
      box-shadow: var(--pill-shadow);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), background 0.16s ease, box-shadow 0.16s ease;
    }
    .btn:hover { background: var(--btn-hover); transform: translateY(-0.5px); }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn.primary {
      background: linear-gradient(165deg, #3ba1ff 0%, #0A84FF 60%, #006be0 100%);
      border-color: rgba(255, 255, 255, 0.45);
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.15);
      box-shadow: 0 6px 16px rgba(10, 132, 255, 0.30), inset 0 1.5px 0 rgba(255, 255, 255, 0.55), inset 0 -1px 0 rgba(0, 0, 0, 0.14);
    }
    .btn.primary:hover { background: linear-gradient(165deg, #52adff 0%, #148cff 60%, #0070ec 100%); }
    .btn.xs { padding: 4px 10px; font-size: 11px; border-radius: 999px; }
    .btn.danger { background: var(--banner-err-bg); border-color: var(--banner-err-border); color: var(--banner-err-text); }

    /* 水滴晶体电源球 */
    .power-zone {
      display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 6px 0 2px;
    }
    .power-btn {
      position: relative; overflow: hidden;
      width: 106px; height: 106px; border-radius: 50%; cursor: pointer;
      background: radial-gradient(circle at 32% 24%, rgba(105, 185, 255, 0.96), rgba(10, 132, 255, 0.88) 62%, rgba(0, 96, 214, 0.92) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 14px 30px rgba(10, 132, 255, 0.32), 0 2px 6px rgba(10, 132, 255, 0.22), inset 0 2px 3px rgba(255, 255, 255, 0.70), inset 0 -4px 8px rgba(0, 58, 145, 0.28);
      backdrop-filter: blur(20px);
      color: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, background 0.22s ease;
    }
    .power-btn::before {
      content: ""; position: absolute; top: 5px; left: 16%; right: 16%; height: 38%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.52) 0%, rgba(255, 255, 255, 0.04) 100%);
      pointer-events: none;
    }
    .power-btn:hover { transform: scale(1.04); box-shadow: 0 16px 34px rgba(10, 132, 255, 0.38), inset 0 2px 3px rgba(255, 255, 255, 0.78); }
    .power-btn:active { transform: scale(0.96); }
    .power-btn.connected {
      background: radial-gradient(circle at 32% 24%, rgba(92, 232, 160, 0.96), rgba(16, 185, 129, 0.88) 62%, rgba(5, 135, 92, 0.92) 100%);
      border-color: rgba(255, 255, 255, 0.70);
      box-shadow: 0 14px 30px rgba(16, 185, 129, 0.32), inset 0 2px 3px rgba(255, 255, 255, 0.72), inset 0 -4px 8px rgba(4, 92, 60, 0.26);
    }
    .power-btn.connected svg { color: #ffffff; }
    .power-btn.connected:hover {
      background: radial-gradient(circle at 32% 24%, rgba(252, 129, 129, 0.96), rgba(239, 68, 68, 0.88) 62%, rgba(185, 28, 28, 0.92) 100%);
      border-color: rgba(255, 255, 255, 0.72);
      box-shadow: 0 14px 30px rgba(220, 38, 38, 0.32), inset 0 2px 3px rgba(255, 255, 255, 0.70);
    }
    .power-btn.connected:hover svg { color: #ffffff; }
    .power-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .power-sub { font-size: 12px; font-weight: 500; color: var(--sec); text-align: center; }

    /* 液态玻璃分组卡片 */
    .ios-group {
      background: var(--glass-grad);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      overflow: hidden;
    }
    .ios-cell {
      padding: 8.5px 13px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 12px;
      border-bottom: 1px solid var(--border-soft);
    }
    .ios-cell:last-child { border-bottom: 0; }
    .info-label { color: var(--sec); font-weight: 500; white-space: nowrap; }
    .info-val { font-weight: 600; color: var(--text); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 158px; }

    /* 液态玻璃胶囊开关 */
    .ios-switch {
      position: relative; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
      font-size: 12px; font-weight: 500; color: var(--sec);
    }
    .ios-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .ios-switch .slider {
      width: 38px; height: 22px; border-radius: 999px;
      background: var(--switch-track);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.16);
      position: relative; transition: background 0.2s ease; flex-shrink: 0;
    }
    .ios-switch .slider::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.24), inset 0 1px 0 #ffffff;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ios-switch input:checked + .slider { background: linear-gradient(180deg, #34d399, #22c55e); }
    .ios-switch input:checked + .slider::after { transform: translateX(16px); }
    .ios-switch.sm .slider { transform: scale(0.86); }

    .diag-card {
      background: var(--glass-grad); border: 1px solid var(--border); border-radius: 16px;
      padding: 10px 13px; font-size: 11.5px; font-weight: 500; color: var(--text);
      display: flex; flex-direction: column; gap: 6px;
      backdrop-filter: blur(26px) saturate(185%);
      box-shadow: var(--glass-shadow);
    }
    .diag-card.ok { background: var(--banner-ok-bg); border-color: var(--banner-ok-border); color: var(--banner-ok-text); }
    .diag-card.err { background: var(--banner-err-bg); border-color: var(--banner-err-border); color: var(--banner-err-text); }

    .mode-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chip-btn {
      font-size: 12px; font-weight: 600; padding: 7px 10px; border-radius: 999px; cursor: pointer;
      background: var(--btn-bg); color: var(--text);
      border: 1px solid var(--btn-border); text-align: center;
      backdrop-filter: blur(18px) saturate(180%);
      box-shadow: var(--pill-shadow);
      transition: transform 0.14s ease, background 0.14s ease;
    }
    .chip-btn:hover { background: var(--btn-hover); }
    .chip-btn:active { transform: scale(0.96); }
    .chip-btn.warn { border-color: var(--banner-err-border); color: var(--accent-warn); background: rgba(245, 158, 11, 0.16); }
    .chip-btn.active { background: var(--banner-bg); border-color: var(--banner-border); color: var(--banner-text); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.9s linear infinite; }

    /* 右侧液态玻璃工作区 */
    .main {
      flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0;
      background: var(--main-bg);
    }
    .tab-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 11px 18px;
      background: var(--tabbar-bg);
      backdrop-filter: blur(26px) saturate(185%);
      border-bottom: 1px solid var(--border-soft);
    }
    .ios-seg {
      display: inline-flex; padding: 3px; border-radius: 999px;
      background: var(--seg-bg);
      border: 1px solid var(--border-soft);
      backdrop-filter: blur(20px) saturate(180%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
      gap: 2px; flex-wrap: wrap;
    }
    .ios-seg button {
      border: none; background: transparent; color: var(--sec);
      font-size: 12px; font-weight: 600; padding: 5px 13px; border-radius: 999px; cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }
    .ios-seg button.active {
      background: var(--seg-active-bg); color: var(--seg-active-text); font-weight: 700;
      box-shadow: var(--pill-shadow);
    }

    .pane {
      flex: 1; display: none; flex-direction: column; gap: 11px; padding: 14px 18px;
      overflow: hidden; min-height: 0;
    }
    .pane.active { display: flex; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    input, select, textarea {
      background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 999px;
      color: var(--text); padding: 7px 14px; font-size: 12px; font-weight: 500; outline: none; font-family: inherit;
      backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05), inset 0 -1px 0 rgba(255, 255, 255, 0.35);
    }
    textarea { border-radius: 14px; padding: 9px 12px; width: 100%; min-height: 68px; resize: vertical; font-family: ui-monospace, Consolas, monospace; }
    input::placeholder, textarea::placeholder { color: var(--tert); }
    select option { background: var(--option-bg); color: var(--text); }

    .node-list {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0;
      background: var(--glass-grad);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
    }
    .node-list::-webkit-scrollbar { width: 6px; }
    .node-list::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }

    .node-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10.5px 15px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 13px; color: var(--text); cursor: pointer; transition: background 0.14s ease;
    }
    .node-item:last-child { border-bottom: 0; }
    .node-item:hover { background: var(--row-hover); }
    .node-item.selected { background: var(--row-selected); }
    .node-title { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 7px; }
    .node-sub { font-size: 11px; font-weight: 500; color: var(--sec); margin-top: 2px; }
    .check-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ios-green); flex-shrink: 0; box-shadow: 0 0 8px rgba(48, 209, 88, 0.55); }

    .meta { color: var(--sec); font-size: 11.5px; font-weight: 500; }
    .tag {
      display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 700;
      color: var(--accent-green); margin-left: 4px;
    }
    .tag.dc { background: var(--seg-bg); color: var(--sec); }
    .tag.warn { color: var(--accent-warn); }
    .tag.err { color: var(--accent-err); }
    .tag.spd {
      background: var(--seg-bg); border: 1px solid var(--border-soft);
      color: var(--text); padding: 2px 8px;
    }

    .empty-tip {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      color: var(--sec); font-size: 13px; font-weight: 500; padding: 28px; text-align: center;
    }

    .task-banner {
      display: none; align-items: center; justify-content: space-between; gap: 10px;
      margin: 10px 18px 0; padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: var(--banner-bg); border: 1px solid var(--banner-border); color: var(--banner-text);
      backdrop-filter: blur(22px) saturate(180%);
      box-shadow: var(--pill-shadow);
    }
    .task-banner.show { display: flex; }
    .task-banner.ok { background: var(--banner-ok-bg); border-color: var(--banner-ok-border); color: var(--banner-ok-text); }
    .task-banner.err { background: var(--banner-err-bg); border-color: var(--banner-err-border); color: var(--banner-err-text); }

    .modal-mask {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.34); backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 900;
    }
    .modal-mask.open { display: flex; }
    .modal {
      width: 100%; max-width: 600px; max-height: 86vh; overflow-y: auto;
      background: var(--modal-bg); backdrop-filter: blur(36px) saturate(190%);
      border: 1px solid var(--border); border-radius: 22px; color: var(--text);
      padding: 18px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.32), inset 0 1.5px 0 rgba(255, 255, 255, 0.65);
    }
    pre.logs {
      background: var(--log-bg); border: 1px solid var(--border-soft); border-radius: 13px; padding: 10px;
      font-size: 11.5px; color: var(--sec); max-height: 170px; overflow: auto; white-space: pre-wrap;
      font-family: ui-monospace, Consolas, monospace;
    }
    .toast {
      position: fixed; bottom: 16px; right: 18px; padding: 9px 16px; border-radius: 999px;
      background: var(--toast-bg); backdrop-filter: blur(24px) saturate(185%);
      border: 1px solid var(--border); color: var(--toast-text); font-size: 12px; font-weight: 600;
      display: none; z-index: 999; max-width: 340px; box-shadow: var(--glass-shadow);
    }
    .toast.err { border-color: var(--banner-err-border); background: var(--banner-err-bg); color: var(--banner-err-text); }
  </style>
  <script>
    try {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.classList.add('theme-light');

  </script>

  <div id="toast" class="toast"></div>

  <script>
    let STATE = null;
    let ACTIVE_TAB = 'entry';
    let ENTRY_VIEW = '';
    let LAST_DIAG = null;
    let _diagnosing = false;
    let SHOW_DEAD_ENTRY = false;
    let SHOW_DEAD_EXIT = false;

    function getActiveEntryView(state) {
      if (!state) return ENTRY_VIEW || 'auto_free';
      const s = state.settings || {};
      if (ENTRY_VIEW) return ENTRY_VIEW;
      const st = s.underlay_strategy || 'auto_free';
      if (st === 'auto') return 'auto_free';
      if (st === 'manual') {
        const sel = s.selected_underlay || '';
        if (sel.startsWith('WARP-')) return 'warp_only';
        if (sel.startsWith('公益-')) return 'public_only';
        return 'custom_only';
      }
      return st;
    }

    function setTaskStatus(msg, mode = 'busy') {
      const box = document.getElementById('taskBanner');
      const txt = document.getElementById('taskBannerText');
      const clsBtn = document.getElementById('taskBannerClose');
      if (mode === 'hide' || !msg) {
        box.className = 'task-banner';
        return;
      }
      txt.textContent = msg;
      box.className = 'task-banner show' + (mode === 'ok' ? ' ok' : (mode === 'err' ? ' err' : ''));
      clsBtn.style.display = mode === 'busy' ? 'none' : 'inline-block';
    }

    function showToast(msg, isErr = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast' + (isErr ? ' err' : '');
      el.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.style.display = 'none', 3200);
    }

    async function api(path, body = null) {
      const opts = body !== null
        ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
        : { method: 'GET' };
      const res = await fetch(path, opts);
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || '请求失败');
      return data;
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function fmtBytes(bytes) {
      const n = Number(bytes || 0);
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
      return (n / 1048576).toFixed(1) + ' MB';
    }

    function metricsTags(delayMs, speedMbps) {
      let html = '';
      if (typeof delayMs === 'number') {
        if (delayMs > 0) {
          const cls = delayMs < 300 ? 'tag' : (delayMs < 800 ? 'tag warn' : 'tag err');
          html += `<span class="${cls}">${delayMs} ms</span>`;
        } else {
          html += '<span class="tag dc">超时</span>';
        }
      }
      if (typeof speedMbps === 'number' && speedMbps > 0) {
        html += `<span class="tag spd">${speedMbps} Mbps</span>`;
      }
      return html;
    }

    function switchTab(tab) {
      ACTIVE_TAB = tab;
      document.getElementById('tabBtnEntry').classList.toggle('active', tab === 'entry');
      document.getElementById('tabBtnExit').classList.toggle('active', tab === 'exit');
      document.getElementById('paneEntry').classList.toggle('active', tab === 'entry');
      document.getElementById('paneExit').classList.toggle('active', tab === 'exit');
      updateTabCountBadge();
    }

    function updateTabCountBadge() {
      if (!STATE) return;
      const el = document.getElementById('tabCountBadge');
      if (ACTIVE_TAB === 'entry') {
        const view = getActiveEntryView(STATE);
        if (view === 'direct') { el.textContent = '直连模式'; return; }
        const warpCnt = (STATE.warp && STATE.warp.endpoint_count) || 0;
        const pubCnt = STATE.public_backups_count || 0;
        const userCnt = STATE.custom_underlays.length + STATE.sub_underlays.length;
        const cnt = view === 'warp_only'
          ? warpCnt
          : (view === 'public_only' ? pubCnt : (view === 'custom_only' ? userCnt : (warpCnt + pubCnt)));
        el.textContent = `共 ${cnt} 个节点`;
      } else {
        const cnt = STATE.settings.exit_source === 'vpngate' ? STATE.vpngate_nodes.length : STATE.exits.length;
        el.textContent = `共 ${cnt} 个落地 IP`;
      }
    }

    function openSettingsModal() {
      document.getElementById('settingsModal').classList.add('open');
      refreshLogs();
    }
    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function renderEntryNodes(state) {
      const s = state.settings;
      const view = getActiveEntryView(state);
      const list = document.getElementById('entryNodeList');
      list.innerHTML = '';

      document.getElementById('awgLabel').style.display = (view === 'auto_free' || view === 'warp_only') ? '' : 'none';
      document.getElementById('pullFreeBtn').style.display = (view === 'auto_free' || view === 'warp_only' || view === 'public_only') ? '' : 'none';
      document.getElementById('testAllEntryBtn').style.display = view === 'direct' ? 'none' : '';
      document.getElementById('underlayImportRow').style.display = (view === 'auto_free' || view === 'custom_only') ? '' : 'none';

      if (view === 'direct') {
        list.innerHTML = `
          <div class="empty-tip">
            <div>当前为「直连」模式：不使用前置加速节点</div>
            <div class="meta">若左侧开启了住宅出口，将尝试直接连接住宅出口；未开启则本机直连。</div>
          </div>`;
        return;
      }

      const custom = state.custom_underlays || [];
      const subs = state.sub_underlays || [];
      const warpEps = (state.warp && state.warp.endpoints) || [];
      const pub = state.public_backups || [];
      const prefix = s.use_awg ? 'WARP-AWG' : 'WARP-WG';

      const includeWarp = (view === 'auto_free' || view === 'warp_only');
      const includePub = (view === 'auto_free' || view === 'public_only');
      const includeUser = (view === 'custom_only');

      if (includeUser) {
        (state.underlay_subs || []).forEach(sub => {
          const div = document.createElement('div');
          div.className = 'node-item';
          div.style.cursor = 'default';
          div.innerHTML = `<div class="meta">订阅组：${esc(sub.name)}（${sub.count} 节点）</div>
            <div class="row" style="gap:6px;">
              <button class="btn xs" onclick="refreshSubs()">更新</button>
              <button class="btn xs danger" onclick="delSub('${sub.id}')">删订阅</button>
            </div>`;
          list.appendChild(div);
        });
      }

      const rows = [];
      if (includeUser) {
        custom.forEach(item => rows.push({
          title: item.name, meta: `自建 · ${item.type} · ${item.server}:${item.port}`,
          delay: item.delay_ms, speed: item.speed_mbps,
          isSelected: s.underlay_strategy === 'manual' && s.selected_underlay === item.name,
          onClick: () => selectUnderlay(item.name),
          testFn: () => testSingleHop1('custom', item.id, ''),
          delFn: () => delUnderlay(item.id),
        }));
        subs.forEach(item => rows.push({
          title: item.name, meta: `订阅 · ${item.type}`,
          delay: item.delay_ms, speed: item.speed_mbps,
          isSelected: s.underlay_strategy === 'manual' && s.selected_underlay === item.name,
          onClick: () => selectUnderlay(item.name),
          testFn: () => testSingleHop1('sub', '', item.name),
          delFn: null,
        }));
      }
      if (includePub) {
        pub.forEach(item => rows.push({
          title: item.name, meta: `公益 · ${item.type}`,
          delay: item.delay_ms, speed: item.speed_mbps,
          isSelected: s.underlay_strategy === 'manual' && s.selected_underlay === item.name,
          onClick: () => selectUnderlay(item.name),
          testFn: () => testSingleHop1('public', item.id, ''),
          delFn: null,
        }));
      }
      if (includeWarp) {
        warpEps.forEach((ep, i) => {
          const name = `${prefix}-${String(i + 1).padStart(2, '0')}`;
          rows.push({
            title: name, meta: `WARP · ${ep.ip}:${ep.port}`,
            delay: ep.delay_ms, speed: ep.speed_mbps,
            isSelected: s.underlay_strategy === 'manual' && s.selected_underlay === name,
            onClick: () => selectUnderlay(name),
            testFn: () => testSingleHop1('warp', '', name),
            delFn: null,
          });
        });
      }

      const rankTuple = r => {
        if (typeof r.delay === 'number' && r.delay > 0) return [0, -(Number(r.speed) || 0), r.delay];
        if (r.delay === -1) return [2, 0, 99999];
        return [1, 0, 99999];
      };
      rows.sort((a, b) => {
        const ta = rankTuple(a), tb = rankTuple(b);
        return (ta[0] - tb[0]) || (ta[1] - tb[1]) || (ta[2] - tb[2]);
      });

      const hiddenDead = rows.filter(r => r.delay === -1);
      const visibleRows = SHOW_DEAD_ENTRY ? rows : rows.filter(r => r.delay !== -1);

      visibleRows.forEach(r => {
        const div = document.createElement('div');
        div.className = 'node-item' + (r.isSelected ? ' selected' : '');
        div.onclick = r.onClick;
        div.innerHTML = `
          <div style="min-width:0; overflow:hidden;">
            <div class="node-title">${r.isSelected ? '<i class="check-dot"></i>' : ''}<span>${esc(r.title)}</span></div>
            <div class="node-sub">${esc(r.meta)}</div>
          </div>
          <div class="row" style="gap:6px; flex-shrink:0;">
            ${metricsTags(r.delay, r.speed)}
            <button class="btn xs test-btn">测速</button>

          : `已隐藏 ${hiddenDead.length} 个不可用节点 · <a href="#" style="color:var(--accent-blue)" onclick="SHOW_DEAD_ENTRY=true;renderEntryNodes(STATE);return false;">显示全部</a>`;

    function renderVpngateList() {
      if (!STATE) return;
      const nodes = STATE.vpngate_nodes || [];
      const clsFilter = document.getElementById('vgClassFilter').value;
      const cSel = document.getElementById('vgCountryFilter');
      const prevCountry = cSel.value || 'ALL';

      const countByCountry = {};
      nodes.forEach(n => {
        if (clsFilter === 'residential' && n.line_class !== 'residential') return;
        const cc = n.country_short || 'GL';
        countByCountry[cc] = (countByCountry[cc] || 0) + 1;
      });
      const westOrder = ['US', 'CA', 'GB', 'UK', 'DE', 'FR', 'NL', 'CH', 'SE', 'IT', 'ES', 'AU'];
      const countries = Array.from(new Set(nodes.map(n => n.country_short))).sort((a, b) => {
        const ia = westOrder.indexOf(a), ib = westOrder.indexOf(b);
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return 1;
        return a.localeCompare(b);
      });
      cSel.innerHTML = '<option value="ALL">全部国家</option>';
      countries.forEach(c => {
        const opt = document.createElement('option');
        const cnt = countByCountry[c] || 0;
        opt.value = c; opt.textContent = cnt ? `${c} (${cnt})` : c;
        if (c === prevCountry) opt.selected = true;
        cSel.appendChild(opt);
      });

      const listEl = document.getElementById('exitNodeList');
      if (STATE.settings.exit_source !== 'vpngate') return;

      const filtered = nodes.filter(n => {
        if (clsFilter === 'residential' && n.line_class !== 'residential') return false;
        if (cSel.value !== 'ALL' && n.country_short !== cSel.value) return false;
        return true;
      });

      if (!nodes.length) {
        listEl.innerHTML = `
          <div class="empty-tip">
            <div>还没有拉取免费住宅家宽列表</div>
            <button class="btn primary" onclick="refreshVpngate()">一键拉取家宽</button>
          </div>`;
        return;
      }

      filtered.sort((a, b) => {
        const ra = (typeof a.delay_ms === 'number' && a.delay_ms > 0) ? 0 : (a.delay_ms === -1 ? 2 : 1);
        const rb = (typeof b.delay_ms === 'number' && b.delay_ms > 0) ? 0 : (b.delay_ms === -1 ? 2 : 1);
        if (ra !== rb) return ra - rb;
        const sa = Number(a.speed_mbps) || 0, sb = Number(b.speed_mbps) || 0;
        if (sb !== sa) return sb - sa;
        return (a.delay_ms || 99999) - (b.delay_ms || 99999);
      });

      const hiddenDead = filtered.filter(n => n.delay_ms === -1);
      const visible = SHOW_DEAD_EXIT ? filtered : filtered.filter(n => n.delay_ms !== -1);

      if (!visible.length) {
        listEl.innerHTML = '<div class="empty-tip">当前筛选条件没有可用节点，可点“拉取家宽”或切换国家。</div>';
        return;
      }

      const selId = STATE.settings.selected_vpngate_id;
      listEl.innerHTML = '';
      visible.slice(0, 80).forEach(n => {
        const isSel = n.id === selId;
        const div = document.createElement('div');
        div.className = 'node-item' + (isSel ? ' selected' : '');
        div.onclick = () => selectVpngate(n.id);
        const tagTxt = n.line_class === 'residential' ? '家宽' : '机房';
        div.innerHTML = `
          <div style="min-width:0; overflow:hidden;">
            <div class="node-title">${isSel ? '<i class="check-dot"></i>' : ''}<span>${esc(n.name)}</span><span class="tag ${n.line_class === 'residential' ? '' : 'dc'}">${tagTxt}</span></div>
            <div class="node-sub">${esc(n.isp || '')} · ${esc(n.proto).toUpperCase()} · ${n.speed_mbps}M</div>
          </div>
          <div class="row" style="gap:6px; flex-shrink:0;">${metricsTags(n.delay_ms, null)}</div>`;
        listEl.appendChild(div);
      });

      if (hiddenDead.length) {
        const foot = document.createElement('div');
        foot.className = 'meta';
        foot.style.cssText = 'text-align:center; padding:8px 0;';
        foot.innerHTML = SHOW_DEAD_EXIT
          ? `<a href="#" style="color:var(--accent-blue)" onclick="SHOW_DEAD_EXIT=false;renderVpngateList();return false;">隐藏 ${hiddenDead.length} 个不可用节点</a>`
          : `已隐藏 ${hiddenDead.length} 个不可用节点 · <a href="#" style="color:var(--accent-blue)" onclick="SHOW_DEAD_EXIT=true;renderVpngateList();return false;">显示全部</a>`;
        listEl.appendChild(foot);
      }
    }

      listEl.innerHTML = '';

    function renderDiagCard(state) {
      const card = document.getElementById('diagCard');
      const txt = document.getElementById('diagText');
      const acts = document.getElementById('diagActions');
      const rt = state.runtime || {};
      const s = state.settings || {};
      acts.innerHTML = '';

      if (!rt.running) {
        card.className = 'diag-card';
        txt.textContent = '选择加速线路后点击上方圆形按钮连接';
        return;
      }

      if (_diagnosing) {
        card.className = 'diag-card';
        txt.textContent = '正在检测加速线路与出口 IP...';
        return;
      }

      const d = LAST_DIAG;
      if (!d) {
        card.className = 'diag-card ok';
        txt.textContent = '已连接 · 可检测当前出口';
        const b = document.createElement('button');
        b.className = 'btn xs'; b.textContent = '检测出口'; b.onclick = runDiagnose;
        acts.appendChild(b);
        return;
      }

      if (d.fault_hop === 'underlay') {
        card.className = 'diag-card err';
        txt.innerHTML = '<strong>加速线路不通</strong>，建议一键切换：';
        [
          ['换 WARP', () => pullFreeUnderlays()],
          ['切公益节点', () => setStrategy('public_only')],
          ['选我的节点', () => { switchTab('entry'); setStrategy('custom_only'); }],
        ].forEach(([label, fn]) => {
          const b = document.createElement('button');
          b.className = 'btn xs'; b.textContent = label; b.onclick = fn;
          acts.appendChild(b);
        });
        return;
      }

      if (d.fault_hop === 'exit') {
        card.className = 'diag-card err';
        txt.innerHTML = `加速正常 (${d.underlay_ms}ms)，但<strong>住宅出口不可达</strong>`;
        [
          ['换家宽', () => testVpngate()],
          ['换私人住宅', () => { switchTab('exit'); setExitSource('residential'); }],
          ['直出', () => toggleExitHop(false)],
        ].forEach(([label, fn]) => {
          const b = document.createElement('button');
          b.className = 'btn xs'; b.textContent = label; b.onclick = fn;
          acts.appendChild(b);
        });
        return;
      }

      card.className = 'diag-card ok';
      const p = d.probe || {};
      const delayStr = s.use_exit_hop ? `${d.underlay_ms}ms -> ${d.exit_ms}ms` : `${d.underlay_ms}ms`;
      const ipStr = p.ok ? `${esc(p.ip)} · ${esc(p.country)} ${esc(p.city)}` : '出口 IP 未知';
      txt.innerHTML = `<strong>${ipStr}</strong><br><span class="meta">延迟 ${delayStr} · ${esc(p.isp || '')}</span>`;
      const b = document.createElement('button');
      b.className = 'btn xs'; b.textContent = '复测'; b.onclick = runDiagnose;
      acts.appendChild(b);
    }

    const SVG_POWER = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>';
    const SVG_SPIN = '<svg class="spin" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';

    function syncLogoColor(rt) {
      const logo = document.getElementById('brandLogo');
      const wrap = document.getElementById('brandIcoWrap');
      const pBtn = document.getElementById('powerBtn');
      const reclaimBtn = document.getElementById('reclaimProxyBtn');
      const sysHijacked = !!(rt.running && rt.mode === 'system' && rt.sys_proxy_ok === false);
      if (reclaimBtn) reclaimBtn.style.display = sysHijacked ? 'block' : 'none';
      if (wrap) wrap.classList.toggle('is-warn', sysHijacked);
      if (logo) {
        if (pBtn && pBtn.disabled) logo.className = 'sb-logo busy';
        else if (sysHijacked) logo.className = 'sb-logo warn';
        else if (rt.running) logo.className = 'sb-logo on';
        else logo.className = 'sb-logo idle';
      }
    }

    function renderRuntimeOnly(rt, smartStatus, proxyGuard) {
      const pBtn = document.getElementById('powerBtn');
      const pLbl = document.getElementById('powerLabel');
      const pSub = document.getElementById('powerSub');
      const pIcon = document.getElementById('powerIcon');
      if (rt.running) {
        pBtn.classList.add('connected');
        pLbl.textContent = '已连接';
        pSub.textContent = rt.mode === 'tun'
          ? 'TUN 全局网卡'
          : (rt.sys_proxy_ok === false ? '系统代理已被外部关闭' : `系统代理 · ${rt.mixed_port}`);
        document.getElementById('trafficLine').style.display = 'flex';
        document.getElementById('sumTraffic').textContent = `↑${fmtBytes(rt.up_bps)}/s · ↓${fmtBytes(rt.down_bps)}/s`;
      } else {
        pBtn.classList.remove('connected');
        pLbl.textContent = '一键连接';
        pSub.textContent = '未连接';
        document.getElementById('trafficLine').style.display = 'none';
      }
      if (!pBtn.disabled && pIcon) pIcon.innerHTML = SVG_POWER;
      syncLogoColor(rt);

      const gHint = document.getElementById('guardHint');
      if (gHint && proxyGuard && proxyGuard.healed_count > 0) {
        gHint.textContent = `已自动恢复 ${proxyGuard.healed_count} 次`;
      } else if (gHint) {
        gHint.textContent = '';
      }

      if (STATE && STATE.settings && smartStatus) {
        const smLine = document.getElementById('smartMetaLine');
        if (smartStatus.running) {
          smLine.style.display = 'block';
          smLine.textContent = '后台正在智能优选...';
        } else if (STATE.settings.smart_auto_select && smartStatus.last_summary) {
          smLine.style.display = 'block';
          smLine.textContent = `上次优选 ${smartStatus.last_run_at}: ${smartStatus.last_summary}`;
        }
      }
    }

    function applyThemeFromState(stateOrRt) {
      const uiTheme = (stateOrRt && stateOrRt.settings && stateOrRt.settings.ui_theme)
        || (STATE && STATE.settings && STATE.settings.ui_theme)
        || 'auto';
      let isLight;
      if (uiTheme === 'light') {
        isLight = true;
      } else if (uiTheme === 'dark') {
        isLight = false;
      } else if (stateOrRt && typeof stateOrRt.system_light === 'boolean') {
        isLight = stateOrRt.system_light;
      } else if (STATE && typeof STATE.system_light === 'boolean') {
        isLight = STATE.system_light;
      } else {
        isLight = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
      }
      document.documentElement.classList.toggle('theme-light', isLight);
    }

    function render(state) {
      STATE = state;
      if (typeof state.acrylic_active === 'boolean') {
        document.documentElement.classList.toggle('acrylic', state.acrylic_active);
      }
      applyThemeFromState(state);
      const s = state.settings;
      const rt = state.runtime;
      const cs = state.core_status || {};

      renderRuntimeOnly(rt, state.smart_status || {}, state.proxy_guard || {});

      const stratLabels = {
        auto_free: '自动免费',
        warp_only: '仅 WARP',
        public_only: '仅公益',
        custom_only: '自建前置',
        manual: s.selected_underlay || '指定节点',
        auto: '全自动',
        direct: '直连',
      };
      document.getElementById('sumEntry').textContent = (rt.running && rt.current_underlay)
        ? rt.current_underlay
        : (stratLabels[s.underlay_strategy] || s.underlay_strategy);

      document.getElementById('useExitCheck').checked = !!s.use_exit_hop;
      if (!s.use_exit_hop) {
        document.getElementById('sumExit').textContent = '未启用';
      } else if (s.exit_source === 'vpngate') {
        const vg = (state.vpngate_nodes || []).find(n => n.id === s.selected_vpngate_id);
        document.getElementById('sumExit').textContent = (rt.running && rt.current_exit)
          ? rt.current_exit
          : (vg ? vg.name : '免费家宽');
      } else {
        const ex = (state.exits || []).find(x => x.id === s.selected_exit_id) || (state.exits || [])[0];
        document.getElementById('sumExit').textContent = ex ? ex.name : '私人住宅';
      }

      document.getElementById('smartAutoCheck').checked = !!s.smart_auto_select;
      document.getElementById('guardProxyCheck').checked = s.guard_system_proxy !== false;

      const sm = state.smart_status || {};
      const smLine = document.getElementById('smartMetaLine');
      if (sm.running) {
        smLine.style.display = 'block';
        smLine.textContent = '后台正在智能优选...';
      } else if (s.smart_auto_select && sm.last_summary) {
        smLine.style.display = 'block';
        smLine.textContent = `上次优选 ${sm.last_run_at}: ${sm.last_summary}`;
      } else {
        smLine.style.display = 'none';
      }

      document.getElementById('proxyModeChip').textContent = s.proxy_mode === 'tun' ? 'TUN 网卡' : '系统代理';
      document.getElementById('routeModeChip').textContent = s.route_mode === 'global' ? '全局代理' : '大陆分流';
      document.getElementById('downloadCoreBtn').style.display = (cs.has_exe && cs.has_geo) ? 'none' : 'block';

      const activeH1 = getActiveEntryView(state);
      document.querySelectorAll('#entryStratSeg button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.s === activeH1);
      });
      document.getElementById('awgCheck').checked = !!s.use_awg;
      renderEntryNodes(state);

      const isVg = s.exit_source !== 'residential';
      document.getElementById('srcVgBtn').classList.toggle('active', isVg);
      document.getElementById('srcResBtn').classList.toggle('active', !isVg);
      document.getElementById('vgTools').style.display = isVg ? 'flex' : 'none';
      document.getElementById('resTools').style.display = isVg ? 'none' : 'flex';
      document.getElementById('resAddBar').style.display = isVg ? 'none' : 'flex';
      renderVpngateList();
      renderResidentialExits(state);
      updateTabCountBadge();

      document.getElementById('adminBadge').textContent = state.is_admin ? '当前权限：管理员 (TUN 可用)' : '当前权限：普通用户';
      document.getElementById('elevateBtn').style.display = state.is_admin ? 'none' : 'inline-block';
      document.getElementById('allowLanCheck').checked = !!s.allow_lan;
      document.getElementById('ipv6Check').checked = !!s.ipv6;
      document.getElementById('trayCheck').checked = s.minimize_to_tray !== false;
      const themeSel = document.getElementById('themeModeSelect');
      if (themeSel && document.activeElement !== themeSel) {
        themeSel.value = s.ui_theme || 'auto';
      }
      if (document.activeElement !== document.getElementById('mixedPortInput')) {
        document.getElementById('mixedPortInput').value = s.mixed_port || 17890;
      }
      if (document.activeElement !== document.getElementById('customRulesInput')) {
        document.getElementById('customRulesInput').value = s.custom_rules || '';
      }
      document.getElementById('coreFilesDetail').textContent = Object.entries(cs.files || {})
        .map(([k, v]) => `${k}: ${v.exists ? v.size_mb + 'MB' : '缺失'}`).join(' | ');
      document.getElementById('logsBox').textContent = state.logs || '暂无日志';

      renderDiagCard(state);
    }

      try { render(await api('/api/state')); } catch (e) { showToast(e.message, true); }
    }

    async function refreshLogs() {
      try {
        const r = await api('/api/logs?lines=100');
        document.getElementById('logsBox').textContent = r.logs || '暂无日志';
      } catch (e) { showToast(e.message, true); }
    }

    function applyOptimisticSettings(patch) {
      if (!STATE) return;
      STATE.settings = Object.assign({}, STATE.settings || {}, patch);
      render(STATE);
    }

    async function updateSetting(patch) {
      applyOptimisticSettings(patch);
      try {
        await api('/api/settings', patch);
        if (STATE && STATE.runtime && STATE.runtime.running && patch.auto_apply !== false) {
          setTimeout(() => { pollRuntime(); }, 700);
        }
      } catch (e) {
        showToast(e.message, true);
        await refreshState();
      }
    }

        await api('/api/proxy/reclaim', {});

        await pollRuntime();
      } catch (e) { showToast(e.message, true); }

      try {
        showToast('正在重置 WARP 账号与端点...');

    async function toggleConnect() {
      const btn = document.getElementById('powerBtn');
      const lbl = document.getElementById('powerLabel');
      const icon = document.getElementById('powerIcon');
      const smartPick = !!(STATE && STATE.settings && STATE.settings.smart_auto_select);
      btn.disabled = true;
      if (STATE) syncLogoColor(STATE.runtime || {});
      try {
        if (STATE && STATE.runtime.running) {
          await api('/api/disconnect', {});
          LAST_DIAG = null;
          showToast('已断开连接');
        } else {
          if (icon) icon.innerHTML = SVG_SPIN;
          lbl.textContent = smartPick ? '智能优选中' : '连接中...';
          if (smartPick) {
            setTaskStatus('已启用「智能优选」，正在测速挑选最优线路后连接...', 'busy');
          }
          await api('/api/connect', { smart_pick: smartPick });
          if (smartPick) setTaskStatus('智能优选并连接成功', 'ok');
          showToast('连接成功，正在检测出口...');
          await refreshState();
          await runDiagnose();
          return;
        }
      } catch (e) {
        if (smartPick) setTaskStatus(`连接失败：${e.message}`, 'err');
        showToast(e.message, true);
      } finally {
        btn.disabled = false;
        if (icon) icon.innerHTML = SVG_POWER;
        await refreshState();
      }
    }

    async function runDiagnose() {
      if (!STATE || !STATE.runtime.running) return;
      _diagnosing = true;
      renderDiagCard(STATE);
      try {
        LAST_DIAG = await api('/api/diagnose', {});
      } catch (e) {
        LAST_DIAG = null;
        showToast(e.message, true);
      } finally {
        _diagnosing = false;
        if (STATE) renderDiagCard(STATE);
      }
    }

    async function pullFreeUnderlays() {
      setTaskStatus('第 1/2 步：正在拉取免费加速节点（WARP + 公益）...', 'busy');
      try {
        const pullRes = await api('/api/underlay/pull', { auto_test: false });
        await refreshState();
        setTaskStatus(`第 2/2 步：已显示 ${pullRes.warp_count} WARP + ${pullRes.public_count} 公益节点，正在并发测速与优选...`, 'busy');

        const testRes = await api('/api/underlay/test_all', {
          kind: getActiveEntryView(STATE) === 'warp_only'
            ? 'warp'
            : (getActiveEntryView(STATE) === 'public_only' ? 'public' : 'free'),
          test_speed: true,
        });
        await refreshState();
        const bestInfo = testRes.best_name
          ? `，最快：${testRes.best_name} (${testRes.best_ms}ms${testRes.best_mbps ? ' · ' + testRes.best_mbps + ' Mbps' : ''})`
          : '';
        setTaskStatus(`拉取并优选完成：可用 ${testRes.alive}/${testRes.tested}${bestInfo}`, 'ok');
      } catch (e) {
        setTaskStatus(`拉取或优选失败：${e.message}`, 'err');
      }
    }

    async function testAllHop1() {
      const view = getActiveEntryView(STATE);
      if (view === 'direct') {
        showToast('当前为直连模式，无需测速前置节点');
        return;
      }
      const kindMap = { warp_only: 'warp', public_only: 'public', custom_only: 'user', auto_free: 'free' };
      const kind = kindMap[view] || 'all';
      setTaskStatus('正在并发测速当前分类节点的延迟与下载速度...', 'busy');
      try {
        const r = await api('/api/underlay/test_all', { kind, test_speed: true });
        await refreshState();
        const bestInfo = r.best_name
          ? `，最快：${r.best_name} (${r.best_ms}ms${r.best_mbps ? ' · ' + r.best_mbps + ' Mbps' : ''})`
          : '';
        setTaskStatus(`测速完成：可用 ${r.alive}/${r.tested}${bestInfo}`, 'ok');
      } catch (e) {
        setTaskStatus(`测速失败：${e.message}`, 'err');
      }
    }

    async function testSingleHop1(kind, id, name) {
      showToast('正在测速该节点...');
      try {
        const r = await api('/api/underlay/test', { kind, id, name, test_speed: true });
        showToast(r.alive > 0 ? '测速完成' : '节点超时不可用', r.alive === 0);
        await refreshState();
      } catch (e) { showToast(e.message, true); }
    }

    async function importUnderlaySmart() {
      const raw = document.getElementById('underlaySmartInput').value.trim();
      if (!raw) return;
      const isSingleHttp = /^https?:\/\/\S+$/i.test(raw) && !raw.includes('@') && !/^https?:\/\/[^/]+:\d+\/?$/i.test(raw);
      try {
        if (isSingleHttp) {
          showToast('正在拉取订阅...');
          const r = await api('/api/underlay/sub/add', { name: '', url: raw });
          document.getElementById('underlaySmartInput').value = '';
          showToast(`已导入订阅 ${r.count} 个节点`);
        } else {
          const r = await api('/api/underlay/add', { text: raw });
          document.getElementById('underlaySmartInput').value = '';
          showToast(`已添加 ${r.added} 条节点`);
        }
        ENTRY_VIEW = 'custom_only';
        await updateSetting({ underlay_strategy: 'custom_only' });
      } catch (e) { showToast(e.message, true); }
    }

    async function delUnderlay(id) { await api('/api/underlay/delete', { id }); await refreshState(); }
    async function refreshSubs() {
      showToast('正在更新订阅...');
      try { await api('/api/underlay/sub/refresh', {}); await refreshState(); showToast('订阅已更新'); }
      catch (e) { showToast(e.message, true); }
    }
    async function delSub(id) { await api('/api/underlay/sub/delete', { id }); await refreshState(); }

    async function refreshVpngate() {
      const running = STATE && STATE.runtime && STATE.runtime.running;
      setTaskStatus(
        running
          ? '第 1/2 步：正在通过当前加速线路拉取免费住宅家宽列表...'
          : '第 1/2 步：正在后台自动找免费节点连接拉取家宽列表...',
        'busy'
      );
      try {
        const r = await api('/api/vpngate/refresh', { auto_test: false });
        await refreshState();
        setTaskStatus(`第 2/2 步：已显示 ${r.count} 个节点（${r.residential_count} 个家宽），正在并发测速...`, 'busy');

        const country = document.getElementById('vgCountryFilter').value || 'ALL';
        const tr = await api('/api/vpngate/test', { country, max_test: 12 });
        await refreshState();
        if (tr.alive > 0) {
          setTaskStatus(`家宽拉取并优选完成：可用 ${tr.alive}/${tr.tested}，已选最快 ${tr.best_name} (${tr.best_ms}ms)`, 'ok');
        } else {
          setTaskStatus(`已拉取 ${r.count} 个节点，但本轮测试均超时，可换国家或点「测速优选」重试`, 'err');
        }
      } catch (e) {
        setTaskStatus(`拉取免费住宅家宽失败：${e.message}`, 'err');
      }
    }

    async function testVpngate() {
      const country = document.getElementById('vgCountryFilter').value || 'ALL';
      setTaskStatus('正在并发测速免费住宅家宽节点...', 'busy');
      try {
        const r = await api('/api/vpngate/test', { country, max_test: 12 });
        await refreshState();
        if (STATE && STATE.runtime.running) await runDiagnose();
        if (r.alive > 0) {
          setTaskStatus(`家宽测速完成：可用 ${r.alive}/${r.tested}，已选最快 ${r.best_name} (${r.best_ms}ms)`, 'ok');
        } else {
          setTaskStatus('本轮测试节点均超时，请刷新或切换国家重试', 'err');
        }
      } catch (e) {
        setTaskStatus(`家宽测速失败：${e.message}`, 'err');
      }
    }

    async function addExit() {
      const raw = document.getElementById('exitRaw').value.trim();
      const remark = document.getElementById('exitRemark').value.trim();
      if (!raw) return;
      try {
        await api('/api/exit/add', { raw, remark, default_type: 'socks5' });
        document.getElementById('exitRaw').value = '';
        document.getElementById('exitRemark').value = '';
        showToast('住宅 IP 已添加');
        await refreshState();
      } catch (e) { showToast(e.message, true); }
    }

    async function testSingleExit(id) {
      showToast('正在测速该住宅 IP...');
      try {
        const r = await api('/api/exit/test', { id });
        const ms = (r.delays || {})[id];
        showToast(ms ? `延迟: ${ms}ms` : '超时不可达', !ms);
        await refreshState();
      } catch (e) { showToast(e.message, true); }
    }

    async function testAllExits() {
      showToast('正在测速全部私人住宅 IP...');
      try {
        const r = await api('/api/exit/test', {});
        showToast(`测速完成：${r.alive}/${r.tested} 可用`);
        await refreshState();
      } catch (e) { showToast(e.message, true); }
    }

    async function delExit(id) { await api('/api/exit/delete', { id }); await refreshState(); }

    async function downloadCore(force = false) {
      showToast('正在下载内核与规则库...');
      try {
        await api('/api/core/download', { force });
        showToast('内核已就绪');
        await refreshState();
      } catch (e) { showToast(e.message, true); }
    }

    async function saveCustomRules() {
      await updateSetting({ custom_rules: document.getElementById('customRulesInput').value });
      showToast('规则已保存');
    }

    async function elevateAdmin() {
      try { await api('/api/elevate', {}); showToast('正在以管理员身份重启...'); }
      catch (e) { showToast(e.message, true); }
    }

    async function pollRuntime() {
      try {
        const r = await api('/api/runtime');
        if (typeof r.acrylic_active === 'boolean') {
          document.documentElement.classList.toggle('acrylic', r.acrylic_active);
        }
        if (typeof r.system_light === 'boolean' && STATE) {
          STATE.system_light = r.system_light;
          applyThemeFromState(r);
        }
        if (STATE) {
          STATE.runtime = r.runtime || STATE.runtime;
          STATE.smart_status = r.smart_status || STATE.smart_status;
          STATE.update_state = r.update_state || STATE.update_state;
          STATE.proxy_guard = r.proxy_guard || STATE.proxy_guard;
          renderRuntimeOnly(STATE.runtime, STATE.smart_status, STATE.proxy_guard);
          renderUpdateBanner(STATE.update_state);
        }
      } catch (e) {}
    }

    let _latestUpdateInfo = null;
    function renderUpdateBanner(us) {
      const btn = document.getElementById('updateBannerBtn');
      if (!btn) return;
      if (us && us.downloading) {
        btn.style.display = 'block';
        btn.disabled = true;
        btn.textContent = `升级下载中 ${us.progress || 0}%`;
        setTaskStatus(`${us.message || '正在下载新版安装包...'} (${us.progress || 0}%)`, 'busy');
        return;
      }
      if (_latestUpdateInfo && _latestUpdateInfo.has_update) {
        btn.style.display = 'block';
        btn.disabled = false;
        btn.textContent = `发现新版 v${_latestUpdateInfo.latest_version} · 一键升级`;
      } else {
        btn.style.display = 'none';
      }
    }

    async function checkAppUpdate(silent = false) {
      const topBtn = document.getElementById('checkUpdateBtn');
      if (!silent && topBtn) topBtn.textContent = '检测中';
      try {
        const res = await api('/api/update/check');
        _latestUpdateInfo = res;
        if (res.current_version) {
          document.getElementById('verBadge').textContent = 'v' + res.current_version;
        }
        renderUpdateBanner(STATE && STATE.update_state);
        if (!silent) {
          if (res.has_update) {
            if (topBtn) topBtn.textContent = `新 v${res.latest_version}`;
            if (confirm(`检测到新版本 v${res.latest_version}（当前 v${res.current_version}），是否立即一键升级并自动重启？`)) {
              await applyAppUpdate();
            }
          } else {
            if (topBtn) topBtn.textContent = '已是最新';
            showToast(`当前已是最新版本 v${res.current_version}`);
          }
        } else if (res.has_update && topBtn) {
          topBtn.textContent = `新 v${res.latest_version}`;
        }
      } catch (e) {
        if (!silent) {
          if (topBtn) topBtn.textContent = '更新';
          showToast(e.message, true);
        }
      }
    }

    async function applyAppUpdate() {
      try {
        const winUrl = _latestUpdateInfo ? (_latestUpdateInfo.win_setup_url || '') : '';
        await api('/api/update/apply', { win_setup_url: winUrl });
        setTaskStatus('已开始下载新版安装包，完成后将自动静默升级并重启...', 'busy');
        const timer = setInterval(async () => {
          try {
            const r = await api('/api/runtime');
            const us = r.update_state || {};
            renderUpdateBanner(us);
            if (!us.downloading && us.error) {
              clearInterval(timer);
              setTaskStatus(`自动升级失败：${us.error}`, 'err');
            }
          } catch (err) {
            clearInterval(timer);
            setTaskStatus('更新包下载完成，正在安装并重启应用...', 'ok');
          }
        }, 700);
      } catch (e) {
        showToast(e.message, true);
      }
    }

    refreshState().then(() => {
      if (STATE && STATE.app_version) {
        document.getElementById('verBadge').textContent = 'v' + STATE.app_version;
      }
    });
    setTimeout(() => checkAppUpdate(true), 4000);
    setInterval(() => {
      if (document.hidden) return;
      if (STATE && STATE.runtime && STATE.runtime.running) pollRuntime();
    }, 3000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && STATE && STATE.runtime && STATE.runtime.running) pollRuntime();
    });
  </script>
</body>
</html>
